<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata - Carissa Putri Alnabira</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 450px;
            width: 100%;
        }

        /* --- STYLES FRAME FOTO --- */
        .photo-frame {
            width: 150px;
            background: #ffffff;
            padding: 10px 10px 20px 10px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            margin: 0 auto 25px auto;
            border-radius: 8px;
            transform: rotate(-2deg);
            transition: transform 0.3s ease;
        }

        .photo-frame:hover {
            transform: rotate(0deg) scale(1.02);
        }

        .photo-frame img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            border-radius: 4px;
            display: block;
        }

        h2 {
            text-align: center;
            color: #1e293b;
            font-size: 22px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 12px 8px;
            font-size: 14px;
            color: #334155;
            border-bottom: 1px dashed #e2e8f0;
            vertical-align: top;
        }

        tr:last-child td {
            border-bottom: none;
        }

        td.label {
            font-weight: 600;
            width: 38%;
            color: #475569;
        }

        .tag {
            display: inline-block;
            background-color: #e2e8f0;
            color: #334155;
            padding: 3px 8px;
            border-radius: 6px;
            margin: 2px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Bingkai Foto -->
        <div class="photo-frame">
            <img src="IMG_20260713_172409_591.webp" alt="Foto Carissa Putri Alnabira">
        </div>

        <h2>BIODATA DIRI</h2>

        <table>
            <tr>
                <td class="label">Nama Lengkap</td>
                <td>: Carissa Putri Alnabira</td>
            </tr>
            <tr>
                <td class="label">Jenis Kelamin</td>
                <td>: Perempuan</td>
            </tr>
            <tr>
                <td class="label">Tempat, Tgl Lahir</td>
                <td>: Bandung, 7 Januari 2011</td>
            </tr>
            <tr>
                <td class="label">Hobi</td>
                <td>: Menyanyi, Memasak, Bermain alat musik</td>
            </tr>
        </table>
    </div>

</body>
</html>
